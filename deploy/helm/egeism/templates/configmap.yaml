{{- $webURL := required "config.webUrl is required (for example https://egeism.example.com)" .Values.config.webUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: egeism-config
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
data:
  REDIS_ADDR: redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: {{ .Values.config.minioBucket | quote }}
  MINIO_USE_SSL: "false"
  FETCHER_URL: http://fetcher:8090
  WEB_URL: {{ $webURL | quote }}
  MEDIA_PUBLIC_URL: {{ .Values.config.mediaPublicUrl | quote }}
  TZ: {{ .Values.config.timezone | quote }}
  HTTP_ADDR: ":8080"
  API_BASE_URL: http://api:8080
  FETCH_DEADLINE: {{ .Values.config.fetchDeadline | quote }}
  FETCH_DELAY: {{ .Values.config.fetchDelay | quote }}

