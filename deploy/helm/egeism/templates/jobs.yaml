apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-{{ .Values.global.imageTag | trunc 8 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "egeism.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: Never
      containers:
        - name: minio-init
          image: {{ .Values.images.minioClient }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do sleep 2; done
              mc mb --ignore-existing local/{{ .Values.config.minioBucket }}
              mc anonymous set download local/{{ .Values.config.minioBucket }}
              mc mb --ignore-existing local/{{ .Values.config.minioBucket }}-solutions
              mc anonymous set none local/{{ .Values.config.minioBucket }}-solutions
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Values.global.imageTag | trunc 8 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "egeism.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.images.wait }}
          command: [sh, -c, "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: migrate
          image: {{ include "egeism.image" (dict "root" . "component" "migrate") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: egeism-config
            - secretRef:
                name: {{ .Values.existingSecret }}

