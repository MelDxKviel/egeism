apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-{{ .Values.global.imageTag | trunc 8 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "egeism.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: Never
      containers:
        - name: minio-init
          image: {{ include "egeism.image" (dict "root" . "component" "migrate") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_BUCKET
              value: {{ .Values.config.minioBucket | quote }}
            - name: MINIO_USE_SSL
              value: "false"
          args: [init-storage]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Values.global.imageTag | trunc 8 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  activeDeadlineSeconds: 360
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "egeism.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.images.wait }}
          command: [sh, -c, "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: migrate
          image: {{ include "egeism.image" (dict "root" . "component" "migrate") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: egeism-config
            - secretRef:
                name: {{ .Values.existingSecret }}

