{{- if .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: egeism-proxy
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.gateway.serviceType }}
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: egeism-envoy
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egeism
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
  {{- if and .Values.gateway.tls.enabled .Values.acme.enabled }}
  annotations:
    cert-manager.io/issuer: {{ .Values.acme.issuerName | quote }}
  {{- end }}
spec:
  gatewayClassName: egeism-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: egeism-proxy
  listeners:
    - name: http
      hostname: {{ .Values.gateway.hostname | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      hostname: {{ .Values.gateway.hostname | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: egeism-web
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: egeism
      {{- if .Values.gateway.tls.enabled }}
      sectionName: https
      {{- else }}
      sectionName: http
      {{- end }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - backendRefs:
        - name: web
          port: 80
{{- if .Values.gateway.tls.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: egeism-https-redirect
  labels:
    {{- include "egeism.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: egeism
      sectionName: http
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
