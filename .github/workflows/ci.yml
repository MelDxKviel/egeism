name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: egeism
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: egeism_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U egeism -d egeism_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EGEISM_TEST_DATABASE_URL: postgres://egeism:test-only@localhost:5432/egeism_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...   # includes the checker safety-net suite (§7)

  fetcher:
    name: Python fetcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The offline test suite only needs requests + bs4 (the sdamgia fork is
      # imported lazily inside functions, so it isn't required to run the tests).
      - run: pip install beautifulsoup4 requests pytest
      - run: python -m pytest -q
        working-directory: tools/fetch

  web:
    name: Web typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build   # vite build runs the TypeScript typecheck
        working-directory: web
