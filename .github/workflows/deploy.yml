name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Read production pod, hook and event status without deploying
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.diagnostics_only) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ github.event.workflow_run.head_sha || github.sha }}

  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    name: Inspect production deployment hooks
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -eu
            sudo -n k3s kubectl -n egeism get deployments,pods,jobs
            sudo -n k3s kubectl -n egeism get events --sort-by=.lastTimestamp | tail -60
            for component in minio-init migrate; do
              for pod in $(sudo -n k3s kubectl -n egeism get pods -l app.kubernetes.io/component=$component -o name); do
                echo "Hook: $pod"
                sudo -n k3s kubectl -n egeism logs "$pod" --all-containers --tail=60 --pod-running-timeout=10s || true
              done
            done

  deploy:
    needs: images
    name: Deploy tested images to production k3s
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd ~/egeism
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "Skipping superseded deploy"
              exit 0
            fi
            work=$(mktemp -d /tmp/egeism-deploy.XXXXXX)
            trap 'rm -rf -- "$work"' EXIT
            git archive "$DEPLOY_SHA" deploy/helm/egeism deploy/k3s-deploy.sh | tar -x -C "$work"
            sudo -n bash "$work/deploy/k3s-deploy.sh" "$DEPLOY_SHA" "$work/deploy/helm/egeism"
            # The old Compose services must not compete for Telegram or serve
            # a second database after the k3s production release is verified.
            if [ -f deploy/.env ]; then
              docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env stop
            fi
