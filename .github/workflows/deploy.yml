name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect production runtime
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            hostname
            command -v helm || true
            command -v k3s || true
            sudo -n k3s kubectl get nodes -o wide
            sudo -n k3s kubectl get deployments,statefulsets,jobs -A -o wide
            sudo -n k3s kubectl get gateways,httproutes -A
            sudo -n env KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm list -A
            docker ps --format '{{.Names}} {{.Status}} {{.Ports}}'
