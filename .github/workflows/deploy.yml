name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Read production pod, hook and event status without deploying
        type: boolean
        default: false
      retire_failed_hook:
        description: Remove the confirmed orphan hook only after the replacement release is live
        type: boolean
        default: false
      warm_empty_subjects:
        description: Refill empty math and computing banks after the verified fetcher rollout
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  warm_empty_subjects:
    if: github.event_name == 'workflow_dispatch' && inputs.warm_empty_subjects
    name: Warm empty banks after the fetcher rollout
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            set -eu
            curl --fail --silent --show-error https://egeism.ru/api/config | grep -F '"d571d5d2f2ea0e04cbfb1f2096bd3d114e0d8949"'
            sudo -n k3s kubectl -n egeism rollout status deployment/fetcher --timeout=60s
            image=$(sudo -n k3s kubectl -n egeism get deployment fetcher -o 'jsonpath={.spec.template.spec.containers[0].image}')
            test "$image" = 'ghcr.io/meldxkviel/egeism-fetcher:d571d5d2f2ea0e04cbfb1f2096bd3d114e0d8949'
            sudo -n k3s kubectl -n egeism exec statefulset/postgres -- psql -v ON_ERROR_STOP=1 -U egeism -d egeism -c "INSERT INTO bank_sync_jobs (subject, task_limit, active) SELECT s.code, 80, true FROM subjects s WHERE s.code IN ('math', 'inf') AND NOT EXISTS (SELECT 1 FROM tasks t WHERE t.subject_id = s.id AND t.status = 'active' AND task_source_current(t.source, now())) ON CONFLICT DO NOTHING RETURNING subject, state"

  retire_failed_hook:
    if: github.event_name == 'workflow_dispatch' && inputs.retire_failed_hook
    name: Retire the confirmed orphan MinIO hook
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            set -eu
            curl --fail --silent --show-error https://egeism.ru/api/config | grep -F '"d571d5d2f2ea0e04cbfb1f2096bd3d114e0d8949"'
            image=$(sudo -n k3s kubectl -n egeism get job minio-init-9cace87c -o 'jsonpath={.spec.template.spec.containers[0].image}')
            test "$image" = 'minio/mc:latest'
            sudo -n k3s kubectl -n egeism delete job minio-init-9cace87c --wait=true --timeout=30s

  images:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.diagnostics_only) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ github.event.workflow_run.head_sha || github.sha }}

  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    name: Inspect production deployment hooks
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -eu
            sudo -n k3s kubectl -n egeism get deployments,pods,jobs
            sudo -n k3s kubectl -n egeism get events --sort-by=.lastTimestamp | tail -60
            for component in minio-init migrate; do
              for pod in $(sudo -n k3s kubectl -n egeism get pods -l app.kubernetes.io/component=$component -o name); do
                echo "Hook: $pod"
                sudo -n k3s kubectl -n egeism logs "$pod" --all-containers --tail=60 --pod-running-timeout=10s || true
              done
            done
            if [ "$(sudo -n k3s kubectl -n egeism exec statefulset/postgres -- psql -U egeism -d egeism -Atc "SELECT to_regclass('public.bank_sync_jobs') IS NOT NULL")" = t ]; then
              sudo -n k3s kubectl -n egeism exec statefulset/postgres -- psql -U egeism -d egeism -c "SELECT subject, kind, state, result, error, created_at FROM bank_sync_jobs ORDER BY created_at DESC LIMIT 12"
            fi

  deploy:
    needs: images
    name: Deploy tested images to production k3s
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd ~/egeism
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "Skipping superseded deploy"
              exit 0
            fi
            work=$(mktemp -d /tmp/egeism-deploy.XXXXXX)
            trap 'rm -rf -- "$work"' EXIT
            git archive "$DEPLOY_SHA" deploy/helm/egeism deploy/k3s-deploy.sh | tar -x -C "$work"
            sudo -n bash "$work/deploy/k3s-deploy.sh" "$DEPLOY_SHA" "$work/deploy/helm/egeism"
            # The old Compose services must not compete for Telegram or serve
            # a second database after the k3s production release is verified.
            if [ -f deploy/.env ]; then
              docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env stop
            fi
