openapi: 3.0.3
info:
  title: ЕГЭ-платформа API
  version: 0.1.0
  description: >
    Единый backend для веба и Telegram-бота. Вся бизнес-логика (проверка
    ответов, статистика, прогноз балла) — здесь. Контракт заморожен в Phase 0.

servers:
  - url: http://localhost:8080
    description: local dev

# Auth: JWT session tokens. Web users register/login with username+password; the
# bot obtains a token via /api/auth/telegram. Send it as: Authorization: Bearer <token>.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    BankSyncJob:
      type: object
      description: Durable background synchronization; only real source tasks are imported. An import date never substitutes for a task publication date.
      properties:
        id: { type: string, format: uuid }
        subject: { type: string, enum: [rus, math, inf, soc] }
        number: { type: integer }
        limit: { type: integer }
        active: { type: boolean }
        kind: { type: string, enum: [fetch, repair] }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
        result:
          type: object
          properties:
            fetched: { type: integer }
            inserted: { type: integer }
            skipped: { type: integer }
            invalid: { type: integer }
            held: { type: integer, description: Tasks held as drafts because source freshness is unverified or expired }
            promoted: { type: integer }
            source: { type: string }
            scanned: { type: integer, description: Source conditions checked by a repair job }
            updated: { type: integer, description: Conditions refreshed by a repair job }
    TaskSource:
      type: object
      description: Publication evidence is separate from the last source verification. Freshness expires one calendar year after publication.
      properties:
        provider: { type: string }
        extern_id: { type: string }
        url: { type: string, format: uri }
        published_at: { type: string, format: date-time, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        date_evidence_url: { type: string, format: uri }
        date_evidence: { type: string }
    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, enum: [rus, math, inf, soc] }
        title: { type: string }
    AnswerSchema:
      type: object
      description: How to compare an answer (§7). Discriminated by `type`.
      required: [type]
      properties:
        type: { type: string, enum: [number, string, set, sequence, written] }
        correct:
          type: array
          description: Required and nonempty for auto-graded types; optional for written solutions.
          items: { type: string }
        tolerance: { type: number, description: "number: absolute tolerance" }
        ci: { type: boolean, description: "string: case-insensitive" }
        yo_fold: { type: boolean, description: "string: fold ё→е" }
        token: { type: string, enum: [char, split], description: "set/sequence tokenization" }
    Media:
      type: object
      properties:
        key: { type: string }
        kind: { type: string, enum: [image, table, file] }
        alt: { type: string }
    TaskView:
      type: object
      description: Student-facing task. Never includes the correct answer.
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        number: { type: integer }
        statement: { type: string }
        media: { type: array, items: { $ref: '#/components/schemas/Media' } }
        status: { type: string, enum: [draft, active, rejected] }
        answer_kind: { type: string, enum: [number, string, set, sequence, written] }
        part: { type: integer, enum: [1, 2] }
        grading_mode: { type: string, enum: [auto, manual] }
        max_points: { type: integer, minimum: 1 }
        bot_solvable: { type: boolean }
    Attempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid, nullable: true }
        test_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        require_solution: { type: boolean, description: Require photos for each manual task in this assignment. }
    SubmitAnswerRequest:
      type: object
      required: [task_id, raw_answer]
      properties:
        task_id: { type: string, format: uuid }
        raw_answer: { type: string }
        time_spent_ms: { type: integer, format: int64 }
    SubmitAnswerResponse:
      type: object
      properties:
        is_correct: { type: boolean }
        answer_id: { type: string, format: uuid }
        review_status: { type: string, enum: [auto, pending, reviewed] }
        solution:
          type: array
          items: { type: string }
          description: Revealed only for an incorrect auto-graded answer. Pending written solutions never expose the key.
    SolutionPhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        attempt_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        content_type: { type: string, enum: [image/jpeg, image/png] }
        size_bytes: { type: integer, format: int64 }
    AttemptReviewItem:
      type: object
      properties:
        answer_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        number: { type: integer }
        statement: { type: string }
        media: { type: array, items: { $ref: '#/components/schemas/Media' } }
        answer_kind: { type: string }
        raw_answer: { type: string }
        is_correct: { type: boolean }
        correct: { type: array, items: { type: string }, description: Hidden from students until manual review. }
        review_status: { type: string, enum: [auto, pending, reviewed] }
        points: { type: integer, nullable: true }
        max_points: { type: integer }
        teacher_comment: { type: string }
        reviewed_at: { type: string, format: date-time, nullable: true }
        photos: { type: array, items: { $ref: '#/components/schemas/SolutionPhoto' } }
    HeatmapCell:
      type: object
      properties:
        day: { type: string, format: date-time }
        total: { type: integer, format: int64 }
        correct: { type: integer, format: int64 }
    NumberMastery:
      type: object
      properties:
        number: { type: integer }
        total: { type: integer, format: int64 }
        correct: { type: integer, format: int64 }
        avg_time_ms: { type: integer, format: int64 }
    WeakSpot:
      type: object
      properties:
        number: { type: integer }
        total: { type: integer, format: int64 }
        correct: { type: integer, format: int64 }
        avg_time_ms: { type: integer, format: int64 }
        accuracy: { type: number }
    Forecast:
      type: object
      properties:
        subject: { type: string }
        accuracy: { type: number }
        primary_estimate: { type: integer }
        primary_max: { type: integer }
        test_score: { type: integer }
        note: { type: string }
    Notification:
      type: object
      description: >
        In-app (web bell) notification about an assignment event, enriched with
        the assignment/test context so the client can render it and jump to the
        test. assignment_created goes to the student, assignment_done to the
        teacher who assigned.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assignment_created, assignment_done, password_reset_requested, attempt_reviewed] }
        assignment_id: { type: string, format: uuid, nullable: true }
        attempt_id: { type: string, format: uuid, nullable: true, description: Exact attempt to open for submission/review notifications. }
        test_id: { type: string, format: uuid }
        test_title: { type: string }
        subject_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        scheduled_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, nullable: true, description: Optional deadline (absent = no deadline) }
        assignment_status: { type: string, enum: [scheduled, done, missed] }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Liveness + DB readiness
      security: []
      responses:
        '200': { description: ok }
        '503': { description: database unavailable }

  /api/auth/telegram:
    post:
      summary: Resolve a Telegram id to a student and return a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telegram_id]
              properties:
                telegram_id: { type: integer, format: int64 }
                name: { type: string }
      responses:
        '200': { description: "{ token, user }" }

  # /api/auth/register was REMOVED (переработка №6): accounts are created only
  # by an admin (POST /api/admin/users) or a teacher (POST /api/students).

  /api/auth/login:
    post:
      summary: Log in with username + password → session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: "{ token, user }" }
        '401': { description: invalid credentials }

  /api/auth/me:
    get:
      summary: The currently authenticated user
      responses:
        '200': { description: user }
        '401': { description: not authenticated }

  /api/auth/forgot-password:
    post:
      summary: >
        «Забыл пароль»: notifies the user's teachers and active admins (in-app
        bell) so one of them issues a reset link. The response never reveals
        whether the username exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '200': { description: "{ ok: true } — always, no user enumeration" }

  /api/auth/reset-password/{token}:
    get:
      summary: Check a reset token before showing the form (name + expiry)
      security: []
      responses:
        '200': { description: "{ name, expires_at }" }
        '404': { description: unknown, expired or already-used token }

  /api/auth/reset-password:
    post:
      summary: >
        Redeem a one-time reset link: set a new password (token burned in the
        same tx) and log the user in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200': { description: "{ token, user } — session token, auto-login" }
        '400': { description: invalid/expired token or password too short }
        '403': { description: account deactivated }

  /api/users/{userID}/password-reset-link:
    post:
      summary: >
        Issue a one-time password-reset link for a user (valid 1 hour; expired →
        issue a new one). Admin: any account; teacher: only their enrolled
        students. The web builds the URL as <origin>/#reset=<token>.
      responses:
        '201': { description: "{ token, expires_at }" }
        '403': { description: not your student / role too low }

  /api/students:
    get:
      summary: >
        The roster. Teacher: their enrolled students, each tagged with the
        teacher's class names (?scope=all widens to every student, for the
        add-to-class picker). Admin: all students.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all] } }
      responses:
        '200': { description: "[{...user, classes: [{id,name}]}]" }
    post:
      summary: Teacher creates a student account (enrolled to them, optionally straight into a class)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                name: { type: string }
                username: { type: string }
                password: { type: string }
                class_id: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: user }
        '409': { description: username already taken }

  /api/students/{studentID}/enroll:
    post:
      summary: >
        Teacher takes an EXISTING student onto their roster (no class involved —
        the репетитор case). A student may be enrolled to several teachers at
        once; re-enrolling is an idempotent no-op.
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: student }
        '400': { description: target is not a student }
        '403': { description: teacher role required }
    delete:
      summary: >
        Teacher drops the student from their roster AND their classes
        («отчислить»). Account, solve history and other teachers' enrollments
        stay untouched.
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: unenrolled }
        '404': { description: student was not enrolled to this teacher }

  /api/profile:
    get:
      summary: >
        Личный профиль: user + classes (student: their classes with teacher
        names + teachers — the full enrollment list, a student may have several;
        teacher: own classes with member counts + students_count).
      responses:
        '200': { description: "{ user, classes, teachers?, students_count? }" }

  /api/profile/avatar:
    put:
      summary: >
        Set the acting user's avatar (any role). Body {avatar} is a config with
        kind "builder" (parametric SVG assembled client-side: bg/skin/hair_color
        hex colors + hair/eyes/mouth/accessory variant indices) or null to reset
        to the deterministic default. kind "photo" (photo_key) is reserved for
        future uploaded photos and rejected for now. The avatar rides on every
        user payload as user.avatar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avatar:
                  type: object
                  nullable: true
                  properties:
                    kind: { type: string, enum: [builder] }
                    bg: { type: string, example: "#C7D2FE" }
                    skin: { type: string, example: "#F8C09A" }
                    hair_color: { type: string, example: "#4A3728" }
                    hair: { type: integer }
                    eyes: { type: integer }
                    mouth: { type: integer }
                    accessory: { type: integer }
      responses:
        '200': { description: the updated user }
        '422': { description: unrenderable config (bad color / index / kind) }

  /api/classes:
    get:
      summary: The teacher's classes with member counts
      responses:
        '200': { description: classes }
    post:
      summary: Create a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: class }

  /api/classes/{classID}:
    get:
      summary: Class detail (class + members). Owner-teacher only.
      responses:
        '200': { description: "{ class, students }" }
    patch:
      summary: Rename the class
      responses:
        '200': { description: class }
    delete:
      summary: Delete the class (memberships unlink; students stay)
      responses:
        '204': { description: deleted }

  /api/classes/{classID}/members:
    post:
      summary: >
        Add a student to the class. Also creates the teacher↔student enrollment
        (one tx) — the link stats access and assignment targeting run on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id]
              properties:
                student_id: { type: string, format: uuid }
      responses:
        '201': { description: student }

  /api/classes/{classID}/members/{studentID}:
    delete:
      summary: Remove a student from the class (the enrollment stays)
      responses:
        '204': { description: removed }

  /api/classes/{classID}/overview:
    get:
      summary: >
        The class color grid: per-member per-number accuracy for one subject
        (rows = students incl. empty ones, columns = task numbers).
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string, enum: [rus, math, inf, soc] } }
      responses:
        '200': { description: "[{student_id, name, total, correct, by_number: [{number,total,correct}]}]" }

  /api/admin/users:
    get:
      summary: Every account (admin only), admins/teachers first
      responses:
        '200': { description: users }
    post:
      summary: Create an account of any role (teacher may carry a subject scope; empty = сверхучитель)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, username, password]
              properties:
                role: { type: string, enum: [student, teacher, admin] }
                name: { type: string }
                username: { type: string }
                password: { type: string }
                subject: { type: string, enum: [rus, math, inf, soc], nullable: true }
      responses:
        '201': { description: user }
        '409': { description: username already taken }

  /api/admin/users/{userID}:
    patch:
      summary: >
        Partial account edit: name, role+subject, is_active, password. Self-guards:
        an admin can't change their own role or deactivate themselves.
      responses:
        '200': { description: user }
    delete:
      summary: >
        Delete an account. Refused (409) when it still carries history
        (attempts, created tests…) — deactivate instead.
      responses:
        '204': { description: deleted }
        '409': { description: has history — deactivate instead }

  /api/admin/stats:
    get:
      summary: Platform-wide counters + per-subject activity (admin only)
      responses:
        '200': { description: PlatformStats }

  /api/admin/classes:
    get:
      summary: Every class with its teacher's name (admin only)
      responses:
        '200': { description: classes }

  /api/subjects:
    get:
      summary: List subjects
      security: []
      responses:
        '200':
          description: subjects
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Subject' } }

  /api/tasks:
    get:
      summary: List tasks (student view)
      security: []
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: number, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, rejected] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: tasks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TaskView' } }

  /api/tasks/{taskID}:
    get:
      summary: Get one task (student view)
      security: []
      parameters:
        - { name: taskID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskView' }
        '404': { description: not found }

  /api/practice:
    post:
      summary: Start an ad-hoc free-solve session for a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string }
      responses:
        '201':
          description: session
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_id: { type: string, format: uuid }
                  attempt_id: { type: string, format: uuid }

  /api/attempts:
    post:
      summary: Start an attempt of a test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [test_id]
              properties:
                test_id: { type: string, format: uuid }
                assignment_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }

  /api/attempts/{attemptID}/answers:
    post:
      summary: Submit an answer (checker runs server-side)
      parameters:
        - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAnswerRequest' }
      responses:
        '201':
          description: verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitAnswerResponse' }
    get:
      summary: List answers of an attempt
      parameters:
        - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: answers }

  /api/attempts/{attemptID}/review:
    get:
      summary: Review an attempt — each answer joined to its task condition and correct answer
      parameters:
        - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Answers with photos, grades and comments; accessible to the student and their subject teacher.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttemptReviewItem' } }
    put:
      summary: Grade all manual answers of a finished attempt (enrolled subject teacher)
      description: Atomic save; editing points or comments creates a student notification. Identical retries do not notify twice.
      parameters:
        - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grades]
              properties:
                grades:
                  type: array
                  items:
                    type: object
                    required: [answer_id, points]
                    properties:
                      answer_id: { type: string, format: uuid }
                      points: { type: integer, minimum: 0, description: Must not exceed this answer's max_points. }
                      comment: { type: string, maxLength: 5000 }
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttemptReviewItem' } }
        '403': { description: Not this student's subject teacher }
        '422': { description: Unfinished attempt, missing grades or invalid points }

  /api/attempts/{attemptID}/tasks/{taskID}/photos:
    post:
      summary: Attach a photo to an unsubmitted manual answer (attempt owner)
      description: JPEG or PNG, up to 10 MiB and 40 megapixels; at most 5 photos per task.
      parameters:
        - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: taskID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Photo metadata (no public URL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolutionPhoto' }
        '400': { description: Invalid image or size }
        '422': { description: Submitted answer, finished attempt or photo limit }
        '503': { description: Media storage unavailable }

  /api/solution-photos/{photoID}:
    parameters:
      - { name: photoID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read private solution photo (owner, enrolled subject teacher or admin)
      responses:
        '200':
          description: Private image; Cache-Control private, no-store
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403': { description: No access to this attempt }
    delete:
      summary: Remove a photo before answer submission (attempt owner)
      responses:
        '204': { description: Deleted }
        '422': { description: Answer already submitted or attempt finished }

  /api/practice/bank/fetch:
    post:
      summary: Prepare practice tasks in the background (student only)
      description: Returns immediately with a durable job. Subject deduplication and automatic refill cooldown prevent repeated source requests. Existing practice tasks remain available while replenishing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, enum: [math, rus, inf, soc] }
                number: { type: integer, minimum: 1 }
      responses:
        '202':
          description: Queued or existing background job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncJob' }
        '503': { description: Fetcher unavailable }

  /api/practice/bank/fetch/{jobID}:
    get:
      summary: Read background preparation status (student only)
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncJob' }
        '404': { description: Job not found }

  /api/practice/recommended:
    get:
      summary: Adaptive practice starting with numbers 1–3
      description: Unlocks three more numbers after at least 5 graded answers and 80% accuracy on each prerequisite number, considering its last 10 answers. Pending answers are excluded. Harder stages close after regression.
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 30 } }
      responses:
        '200':
          description: Tasks restricted to the current stage, including eligible mistakes and weak numbers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_number: { type: integer }
                  tasks: { type: array, items: { $ref: '#/components/schemas/TaskView' } }
                  mistakes: { type: integer }
                  weak_numbers: { type: array, items: { type: integer } }

  /api/attempts/{attemptID}/finish:
    post:
      summary: Finish an attempt
      parameters:
        - { name: attemptID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }

  /api/students/{studentID}/stats/heatmap:
    get:
      summary: Activity heatmap (per day)
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, description: "YYYY-MM-DD" } }
      responses:
        '200':
          description: cells
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HeatmapCell' } }

  /api/students/{studentID}/stats/mastery:
    get:
      summary: Per-task-number mastery for a subject
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: subject, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: mastery
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NumberMastery' } }

  /api/students/{studentID}/stats/mastery-series:
    get:
      summary: Weekly per-number success points (mastery line chart)
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: subject, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: points }

  /api/students/{studentID}/assignments:
    get:
      summary: Assignments for a student (test info + task count + latest finished attempt result)
      description: >
        Each card includes the result of the assignment's latest finished attempt —
        attempt_id, finished_at, correct, total — so the assigned-tests history can
        show whether, what, and how each test was solved. Those fields are absent /
        zero until the assignment has been solved at least once. due_at carries the
        optional deadline (absent = no deadline); the UI marks an assignment
        "overdue" when due_at < now and still unsolved, "late" when solved after
        due_at.
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: assignment cards }

  /api/students/{studentID}/attempts:
    get:
      summary: Recent attempts feed with per-attempt score
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: attempt summaries }

  /api/notifications:
    get:
      summary: In-app notifications for the acting user (web bell), newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 100 } }
      responses:
        '200':
          description: notifications + exact unread count for the badge
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer, format: int64 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /api/notifications/{notificationID}/read:
    post:
      summary: Mark one of the acting user's notifications as read
      parameters:
        - { name: notificationID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: marked }
        '404': { description: not found (or not this user's) }

  /api/notifications/read-all:
    post:
      summary: Mark all of the acting user's notifications as read
      responses:
        '204': { description: marked }

  /api/students/{studentID}/stats/weak-spots:
    get:
      summary: Worst task numbers by success rate
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: subject, in: query, required: true, schema: { type: string } }
        - { name: min, in: query, schema: { type: integer, default: 3 } }
        - { name: limit, in: query, schema: { type: integer, default: 5 } }
      responses:
        '200':
          description: weak spots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WeakSpot' } }

  /api/students/{studentID}/stats/forecast:
    get:
      summary: Score forecast for a subject
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: subject, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: forecast
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }

  /api/students/{studentID}/stats/day:
    get:
      summary: Heatmap drill-down for a single day
      parameters:
        - { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, description: "YYYY-MM-DD" } }
      responses:
        '200': { description: answers that day }

  /api/admin/tasks:
    get:
      summary: List full tasks incl. answer_schema (bank curation)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: number, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, rejected] } }
      responses:
        '200': { description: tasks }
    post:
      summary: Create a task (teacher)
      responses:
        '201': { description: created }

  /api/admin/tasks/fetch:
    post:
      summary: Queue background synchronization of the task bank (teacher)
      description: >
        Returns immediately. Source fetch, media download and deduplication run
        in a durable background job. Only real sources are used; there is no
        mock fallback. Activation requires a verified source date no older than
        one year; undated tasks remain drafts. Poll the returned job to observe
        completion, including after page navigation or an API restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, enum: [rus, math, inf, soc] }
                limit: { type: integer, default: 30 }
                active: { type: boolean, default: false }
      responses:
        '202':
          description: Queued or existing background job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncJob' }
        '503': { description: Fetcher unavailable }

  /api/admin/tasks/fetch/{jobID}:
    get:
      summary: Read synchronization status (teacher, subject scoped)
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Job status and import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncJob' }
        '404': { description: Job not found }

  /api/admin/tasks/fetch/{jobID}/cancel:
    post:
      summary: Cancel queued or running synchronization (teacher, subject scoped)
      description: Already imported tasks are retained.
      parameters:
        - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncJob' }

  /api/admin/tasks/refetch-formulas:
    post:
      summary: Queue repair of existing source conditions (teacher, subject scoped)
      description: Preserves curated answers and existing assignments. Returns a repair job; poll or cancel via /api/admin/tasks/fetch/{jobID}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string, enum: [rus, math, inf, soc] }
      responses:
        '202':
          description: Queued or existing repair job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncJob' }

  /api/admin/tasks/import:
    post:
      summary: Bulk-import tasks from a JSON array or JSONL (teacher, fallback)
      description: >
        multipart/form-data with a `file` field (plus optional `provider`,
        `status=active`), or a raw JSON/JSONL body. Runs the ingest pipeline:
        media downloaded to MinIO, duplicates skipped, new tasks land as draft.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                provider: { type: string }
                status: { type: string, enum: [draft, active] }
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        '200': { description: "{ fetched, inserted, skipped, invalid }" }

  /api/admin/tasks/{taskID}/answer:
    patch:
      summary: Edit a task's answer schema (curation)
      parameters:
        - { name: taskID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: updated }

  /api/admin/tasks/{taskID}/status:
    patch:
      summary: Set task status active/rejected/draft (curation)
      parameters:
        - { name: taskID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: updated }

  /api/admin/tests:
    get:
      summary: List tests (optionally by subject)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
      responses:
        '200': { description: tests }
    post:
      summary: Create a test (classic|drill)
      responses:
        '201': { description: created }

  /api/admin/tests/{testID}:
    get:
      summary: Test detail with ordered tasks (builder preview / PDF)
      parameters:
        - { name: testID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: test + tasks }

  /api/admin/tests/{testID}/export.pdf:
    get:
      summary: Export a composed test as a printable PDF (teacher)
      description: >
        Renders the variant for print: statements with tables/images, an answer
        blank per task. `answers=1` appends the answer-key page — the teacher's
        copy; without it the file is safe to hand to a student.
      parameters:
        - { name: testID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: answers, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        '200':
          description: the PDF
          content:
            application/pdf: {}

  /api/admin/tasks/summary:
    get:
      summary: Per-номер bank availability for a subject (active + total counts)
      description: >
        Feeds the composed-variant builder: for each задание-номер the subject
        has in the bank, how many tasks total and how many are ACTIVE (usable in
        a generated variant). A subject-scoped teacher's subject overrides the
        query param.
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: subject + номер-ordered availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        number: { type: integer }
                        active: { type: integer }
                        total: { type: integer }

  /api/admin/tests/generate:
    post:
      summary: Auto-build a random variant from the active bank (classic|drill|composed)
      description: >
        classic = one random active task per номер (exam-shaped); drill = N
        random tasks of ONE номер; composed = a teacher-defined mix — `slots`
        gives, per номер, how many tasks to include (e.g. 3× задание1 + 3×
        задание2 + 3× задание3), laid out grouped by номер in the order given.
        Each kind first tops up the bank from the source (best-effort) then
        assembles from active tasks; a номер whose bank ran short yields fewer
        tasks (response `task_count` < `requested`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, kind]
              properties:
                subject: { type: string }
                kind: { type: string, enum: [classic, drill, composed] }
                title: { type: string }
                number: { type: integer, description: "drill only" }
                count: { type: integer, description: "drill only" }
                slots:
                  type: array
                  description: "composed only: per-номер counts; total capped at 100"
                  items:
                    type: object
                    required: [number, count]
                    properties:
                      number: { type: integer }
                      count: { type: integer }
      responses:
        '201': { description: "generated test + task_count (+ requested for composed)" }
        '400': { description: bad kind or invalid composed slots }
        '422': { description: no active tasks match }

  /api/admin/tests/{testID}/items:
    post:
      summary: Add a task to a test at a position
      parameters:
        - { name: testID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: created }

  # POST /api/admin/assignments takes EXACTLY ONE target: student_id (must be
  # the teacher's enrolled student) or class_id (fans out to every active
  # member). individual=true clones the picked test into a personal random
  # variant per student (same number structure, random bank tasks,
  # tests.variant_of = source) — the anti-cheating mode; on a generation
  # failure the student gets the shared test. due_at is the optional deadline
  # (absent = no deadline); when set it must be after scheduled_at, and the
  # worker's overdue sweep flips a still-unsolved assignment to "missed" once
  # it passes (a missed assignment stays solvable — finish flips it to done).
  # Response: { created, assignments }.
  /api/admin/assignments:
    post:
      summary: Assign a test to a student at a time (enqueues TG notification)
      description: require_solution (boolean, default false) requires a photo for every manual task. Currently enabled for math. Assignment and result feeds include require_solution, points, max_points and pending_review.
      responses:
        '201': { description: created }
